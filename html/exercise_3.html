<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fromulario</title>
  </head>
  <body>
    <h1>Formulario</h1>
    <form action="envio.html" target="_blank">
      <label for="lastname">Name</label>
      <input type="text" name="name" id="name" required/> <br><br>

      <label for="lastname">Lastname</label>
      <input type="text" name="lastname" id="lastname" required/> <br><br>

      <label for="age">Age</label>
      <input type="number" name="age" id="age" min="12" max="90" required/> <br><br>

      <label for="email">Email</label>
      <input type="email" name="email" id="email" required/> <br><br>

      <label for="terms">Agree to the terms</label> <br>
      <input type="radio" name="terms" id="terms" required/> Yes
      <input type="radio" name="terms" id="terms" required/> No
      <br><br>

      <label for="">Agree to the terms</label>
      <input type="checkbox" name="1" id="1" /><br><br>

      <input type="submit" value="Submit">
    </form>
  </body>
</html>
